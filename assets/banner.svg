<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#9fb4d0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="998.5" height="258.5" rx="17.25" fill="none" stroke="#233047" stroke-width="1.5"/>
  <!-- decorative dotted grid, subtle -->
  <g fill="#1b2740">
    <circle cx="880" cy="40" r="2.5"/><circle cx="920" cy="40" r="2.5"/><circle cx="960" cy="40" r="2.5"/>
    <circle cx="880" cy="80" r="2.5"/><circle cx="920" cy="80" r="2.5"/><circle cx="960" cy="80" r="2.5"/>
    <circle cx="880" cy="120" r="2.5"/><circle cx="920" cy="120" r="2.5"/><circle cx="960" cy="120" r="2.5"/>
  </g>

  <!-- badge with paw -->
  <rect x="56" y="58" width="144" height="144" rx="32" fill="url(#accent)"/>
  <rect x="56" y="58" width="144" height="144" rx="32" fill="#0d1117" opacity="0.08"/>
  <g fill="#0b1220">
    <!-- pad -->
    <ellipse cx="128" cy="158" rx="34" ry="26"/>
    <!-- toes -->
    <ellipse cx="92"  cy="120" rx="13" ry="17" transform="rotate(-18 92 120)"/>
    <ellipse cx="114" cy="104" rx="12" ry="16"/>
    <ellipse cx="142" cy="104" rx="12" ry="16"/>
    <ellipse cx="164" cy="120" rx="13" ry="17" transform="rotate(18 164 120)"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="126" font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="-1">husky-skill</text>
  <text x="252" y="162" font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8b98ad">Dependency-free Git hooks · a Husky replacement in pure POSIX shell</text>

  <!-- pills -->
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#bcd3f0">
    <g>
      <rect x="250" y="186" width="128" height="30" rx="15" fill="#141d30" stroke="#2b3a55"/>
      <text x="314" y="205.5" text-anchor="middle">0 npm deps</text>
    </g>
    <g>
      <rect x="386" y="186" width="104" height="30" rx="15" fill="#141d30" stroke="#2b3a55"/>
      <text x="438" y="205.5" text-anchor="middle">POSIX sh</text>
    </g>
    <g>
      <rect x="498" y="186" width="150" height="30" rx="15" fill="#141d30" stroke="#2b3a55"/>
      <text x="573" y="205.5" text-anchor="middle">pre-commit &lt;5s</text>
    </g>
    <g>
      <rect x="656" y="186" width="150" height="30" rx="15" fill="#141d30" stroke="#2b3a55"/>
      <text x="731" y="205.5" text-anchor="middle">secret scanning</text>
    </g>
  </g>
</svg>
