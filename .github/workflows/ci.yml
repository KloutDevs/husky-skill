# husky-skill dogfoods its own philosophy: the hooks are the product, so CI
# proves they are valid POSIX shell and pass ShellCheck on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: POSIX syntax check
        run: |
          for f in assets/hooks/* scripts/install.sh; do
            sh -n "$f" && echo "OK  $f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --shell=sh assets/hooks/* scripts/install.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan blocks a fake credential
        run: |
          tmp=$(mktemp -d); cd "$tmp"; git init -q
          git config user.email ci@example.com; git config user.name CI
          cp "$GITHUB_WORKSPACE/assets/hooks/pre-commit" .
          printf 'const k = "AKIAIOSFODNN7EXAMPLE1234"\n' > leak.js
          git add leak.js
          if sh ./pre-commit; then
            echo "::error::pre-commit did NOT block a staged secret"; exit 1
          else
            echo "pre-commit correctly blocked the secret"
          fi
